apiVersion: v1
kind: Secret
metadata:
  name: siriusx-secrets
  namespace: siriusx
type: Opaque
stringData:
  SIRIUSX_SESSION_SECRET: "replace-with-at-least-32-random-bytes"
  SIRIUSX_SSO_SERVICE_TOKEN: "replace-with-a-random-service-token"
  SIRIUSX_INTERNAL_SERVICE_TOKEN: "replace-with-the-same-service-token"
  SIRIUSX_UPSTREAM_MODEL_KEY: ""
  GITHUB_TOKEN: ""
  GITLAB_TOKEN: ""
  SIRIUSX_OIDC_CLIENT_SECRET: ""
