apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: siriusx-backups
  labels:
    app.kubernetes.io/name: backup
    app.kubernetes.io/part-of: siriusx
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: siriusx-backup
  labels:
    app.kubernetes.io/name: backup
    app.kubernetes.io/part-of: siriusx
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
            app.kubernetes.io/part-of: siriusx
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: siriusx/control-plane:offline
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mkdir -p /backups
                  SIRIUSX_DATA_DIRS=/data/control:/data/tool \
                  BACKUP_DIR=/backups \
                  KEEP=14 \
                  NODE_BIN=node \
                  /app/deploy/backup/backup.sh
              volumeMounts:
                - name: control-data
                  mountPath: /data/control
                  readOnly: true
                - name: tool-data
                  mountPath: /data/tool
                  readOnly: true
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: control-data
              persistentVolumeClaim:
                claimName: siriusx-control-data
            - name: tool-data
              persistentVolumeClaim:
                claimName: siriusx-tool-data
            - name: backups
              persistentVolumeClaim:
                claimName: siriusx-backups
