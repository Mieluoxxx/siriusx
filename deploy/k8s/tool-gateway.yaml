apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: siriusx-tool-data
  labels:
    app.kubernetes.io/name: tool-gateway
    app.kubernetes.io/part-of: siriusx
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-gateway
  labels:
    app.kubernetes.io/name: tool-gateway
    app.kubernetes.io/part-of: siriusx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tool-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tool-gateway
        app.kubernetes.io/part-of: siriusx
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4330"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tool-gateway
          image: siriusx/control-plane:offline
          imagePullPolicy: IfNotPresent
          command: ["node", "--import", "tsx", "apps/tool-gateway/src/cli.ts"]
          ports:
            - name: http
              containerPort: 4330
          envFrom:
            - configMapRef:
                name: siriusx-config
            - secretRef:
                name: siriusx-secrets
          env:
            - name: SIRIUSX_TOOL_GATEWAY_DB
              value: /data/tool-gateway.sqlite
            - name: SIRIUSX_TOOL_GATEWAY_PORT
              value: "4330"
            - name: SIRIUSX_TOOL_GATEWAY_HOST
              value: 0.0.0.0
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: siriusx-tool-data
---
apiVersion: v1
kind: Service
metadata:
  name: tool-gateway
  labels:
    app.kubernetes.io/name: tool-gateway
    app.kubernetes.io/part-of: siriusx
spec:
  selector:
    app.kubernetes.io/name: tool-gateway
  ports:
    - name: http
      port: 4330
      targetPort: http
