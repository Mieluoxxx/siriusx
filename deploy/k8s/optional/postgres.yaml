apiVersion: v1
kind: Secret
metadata:
  name: siriusx-postgres
  namespace: siriusx
type: Opaque
stringData:
  POSTGRES_DB: siriusx
  POSTGRES_USER: siriusx
  POSTGRES_PASSWORD: replace-with-a-database-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: siriusx-postgres-data
  namespace: siriusx
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: siriusx
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: siriusx-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "siriusx", "-d", "siriusx"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: siriusx-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: siriusx
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
