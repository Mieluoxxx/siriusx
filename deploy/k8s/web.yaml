apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: siriusx-dsh-data
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: siriusx
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: siriusx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: siriusx
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dsh-web
          image: siriusx/dsh-web:offline
          imagePullPolicy: IfNotPresent
          ports:
            - name: dsh
              containerPort: 3000
          env:
            - name: DSH_HOME
              value: /data/dsh-home
            - name: DSH_TELEMETRY_DISABLED
              value: "1"
            - name: DSH_WEB_URL_FILE
              value: /shared/dsh-web-url
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared
              mountPath: /shared
          readinessProbe:
            tcpSocket:
              port: dsh
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: dsh
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: web-gateway
          image: siriusx/control-plane:offline
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for _ in $(seq 1 180); do [ -s /shared/dsh-web-url ] && break; sleep 1; done
              URL=$(cat /shared/dsh-web-url)
              exec node --import tsx apps/web-gateway/src/cli.ts --control-plane http://control-plane:4320 --dsh-web "$URL" --host 0.0.0.0 --port 8080
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: siriusx-config
            - secretRef:
                name: siriusx-secrets
          volumeMounts:
            - name: shared
              mountPath: /shared
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: siriusx-dsh-data
        - name: shared
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: siriusx
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
