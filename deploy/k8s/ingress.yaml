apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siriusx-web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: siriusx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [web.siriusx.example]
      secretName: siriusx-tls
  rules:
    - host: web.siriusx.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siriusx-device
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: siriusx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [device.siriusx.example]
      secretName: siriusx-device-tls
  rules:
    - host: device.siriusx.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  name: device-ws
