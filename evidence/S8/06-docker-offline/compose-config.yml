name: single-box
services:
  control-plane:
    environment:
      SIRIUSX_DATA_DIR: /data
      SIRIUSX_DB: /data/control.sqlite
      SIRIUSX_SESSION_SECRET: offline-compose-secret
    image: siriusx/control-plane:offline
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 4320
        published: "4320"
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 4321
        published: "4321"
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 4322
        published: "4322"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: siriusx-data
        target: /data
        volume: {}
  tool-gateway:
    command:
      - node
      - --import
      - tsx
      - apps/tool-gateway/src/cli.ts
    environment:
      GITHUB_TOKEN: ""
      GITLAB_TOKEN: ""
      SIRIUSX_TOOL_GATEWAY_DB: /data/tool-gateway.sqlite
      SIRIUSX_TOOL_GATEWAY_HOST: 0.0.0.0
      SIRIUSX_TOOL_GATEWAY_PORT: "4330"
    image: siriusx/control-plane:offline
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 4330
        published: "4330"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: siriusx-data
        target: /data
        volume: {}
networks:
  default:
    name: single-box_default
volumes:
  siriusx-data:
    name: single-box_siriusx-data
