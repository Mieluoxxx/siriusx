packages:
  # DSH plugins are independent packages at the same level as the DSH source
  # checkout. They are never placed under the upstream `packages/` tree.
  - plugins/*
  # Non-plugin shared code: contracts, kernel API, shared clients.
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - jose@6.2.17
  - '@stylexjs/stylex@0.19.2'
